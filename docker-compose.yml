version: '3'

services:

  backend:
    container_name: contablock-backend
    build: ./backend 
    restart: always
    ports:
      - '4000:4000'
    environment:
      BACKEND_PORT: 4000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: db_accounting
      DB_USER: root
      DB_PASS: root
      SC_CLIENT_NETWORK: http://nginx/blockchain
    depends_on:
      - db
      - blockchain
    volumes:
      - ./backend:/usr/src/app

  # gateway:
  #   container_name: contablock-gateway
  #   build: ./gateway
  #   restart: always
  #   ports:
  #     - '3000:3000'
  #   environment:
  #     SC_CLIENT_NETWORK_WEBSOCKET: ws://nginx/blockchain
  #     CONTRACT_ADDRESS: 0x5FbDB2315678afecb367f032d93F642f64180aa3
  #   depends_on:
  #     - backend
  #   volumes:
  #     - ./gateway:/usr/src/app

  frontend:
    container_name: contablock-frontend
    build: ./frontend
    restart: always
    ports:
      - '5173:5173'
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://nginx/api
      VITE_FRONTEND_PORT: 5173

  db:
    image: mysql
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_accounting
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    command: --secure-file-priv=/var/lib/mysql-files
    volumes:
      - ./backend/database/data:/var/lib/mysql-files
    ports:
      - 3306:3306

  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin
    restart: always
    links:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - 8080:80

  blockchain:
    container_name: contablock-blockchain
    build: ./smart-contracts
    ports:
      - '8545:8545'
    volumes:
      - ./smart-contracts:/usr/src/app

  nginx:
    image: nginx 
    container_name: nginx
    restart: always
    ports:
      - "443:443" 
      - "80:80" 
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs
    depends_on:
      - frontend
