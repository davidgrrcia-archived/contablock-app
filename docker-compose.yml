version: '3'

services:

  backend:
    container_name: contablock-backend
    build: ./backend 
    restart: always
    ports:
      - '4000:4000'
    environment:
      BACKEND_PORT: 4000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: db_accounting
      DB_USER: root
      DB_PASS: root
      SC_CLIENT_NETWORK: http://nginx/blockchain
      SC_CONTABLOCK_CONTRACT_ADDRESS: 0x5FbDB2315678afecb367f032d93F642f64180aa3
      SC_PRIVATE_KEY_AUTH: ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
    depends_on:
      - db
      - blockchain

  frontend:
    container_name: contablock-frontend
    build: ./frontend
    restart: always
    ports:
      - '4173:4173'
    depends_on:
      - backend

  db:
    image: mysql
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_accounting
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    command: --secure-file-priv=/var/lib/mysql-files
    volumes:
      - ./backend/database/data:/var/lib/mysql-files
    ports:
      - 3306:3306

  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin
    restart: always
    links:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - 8080:80

  blockchain:
    container_name: contablock-blockchain
    build: ./smart-contracts
    ports:
      - '8545:8545'

  nginx:
    image: nginx 
    container_name: nginx
    restart: always
    ports:
      - '80:80' 
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf 
    depends_on:
      - frontend
