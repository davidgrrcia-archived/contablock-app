version: '3.1'

services:

  db:
    image: mysql
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_accounting
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    command: --secure-file-priv=/var/lib/mysql-files
    volumes:
      - ./backend/database/data:/var/lib/mysql-files
    ports:
      - 3306:3306

  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin
    restart: always
    links:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - 8080:80

  blockchain:
    image: contablock-blockchain
    container_name: contablock-blockchain
    build:
      dockerfile: Dockerfile
      context: ./smart-contracts
    restart: always  
    ports:
        - 8545:8545

  frontend:
    image: contablock-frontend
    container_name: contablock-frontend
    build:
      dockerfile: Dockerfile
      context: ./frontend
    restart: always  
    ports:
        - 5173:5173

  backend:
    image: contablock-backend
    container_name: contablock-backend
    build:
      dockerfile: Dockerfile
      context: ./backend
    restart: always
    depends_on:
        - db
    links:
        - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: db_accounting
      DB_USER: root
      DB_PASS: root
      SC_CLIENT_NETWORK: http://0.0.0.0:8545/
      SC_CONTABLOCK_CONTRACT_ADDRESS: 0x5FbDB2315678afecb367f032d93F642f64180aa3
      SC_PRIVATE_KEY_AUTH: ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
    ports:
        - 4000:4000
