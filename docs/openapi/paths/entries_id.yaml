get:
  summary: Describe Entry
  operationId: describeEntry
  description: Info for a specific entry
  tags:
    - entries
  parameters:
    - name: id
      in: path
      required: true
      description: The id of the entry to retrieve
      schema:
        type: string
  responses:
    '200':
      description: An entry
      content:
        application/json:
          schema:
            $ref: "../schemas/_index.yaml#/Entries_DescribeResponse"
    '403':
        $ref: "../responses/_index.yaml#/Unauthorized"
    '404':
        $ref: "../responses/_index.yaml#/NotFound"
    default:
      $ref: "../responses/_index.yaml#/UnexpectedError"