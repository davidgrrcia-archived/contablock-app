get:
  summary: Describe Account
  operationId: describeAccount
  description: Info for a specific account
  tags:
    - accounts
  parameters:
    - name: id
      in: path
      required: true
      description: The id of the account to retrieve
      schema:
        type: string
  responses:
    '200':
      description: An account
      content:
        application/json:
          schema:
            $ref: "../schemas/_index.yaml#/Accounts_DescribeResponse"
    '403':
        $ref: "../responses/_index.yaml#/Unauthorized"
    '404':
        $ref: "../responses/_index.yaml#/NotFound"
    default:
      $ref: "../responses/_index.yaml#/UnexpectedError"