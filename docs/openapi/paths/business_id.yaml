get:
  summary: Describe Business
  operationId: describeBusiness
  description: Info for a specific business
  tags:
    - business
  parameters:
    - name: id
      in: path
      required: true
      description: The id of the business to retrieve
      schema:
        type: string
  responses:
    '200':
      description: A business
      content:
        application/json:
          schema:
            $ref: "../schemas/_index.yaml#/Business_DescribeResponse"
    '403':
        $ref: "../responses/_index.yaml#/Unauthorized"
    '404':
        $ref: "../responses/_index.yaml#/NotFound"
    default:
      $ref: "../responses/_index.yaml#/UnexpectedError"