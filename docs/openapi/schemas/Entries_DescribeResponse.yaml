type: object
title: Entry
description: Entry details
required:
  - id
  - accountId
  - multipleEntryId
  - currency
  - concept
  - date
  - quarter
  - debitBalance
  - creditBalance
  - totalBalance
  - state
  - stateReason
  - creationDate
  - lastUpdate
properties:
  id:
    type: string
    description: The id of the entry
    minLength: 1
    maxLength: 64
  accountId:
    type: string
    description: The id of the account
    minLength: 1
    maxLength: 64
  multipleEntryId:
    type: string
    description: The id of the multiple entry
    minLength: 1
    maxLength: 64
  currency:
    type: string
    description: The currency of the entry
    minLength: 3
    maxLength: 3
  concept:
    type: string
    description: The concept of the entry
    nullable: true
    minLength: 1
    maxLength: 256
  date:
    type: string
    description: The date of the entry
    minLength: 1
    maxLength: 64
  quarter:
    type: string
    description: The quarter of the entry
    minLength: 1
    maxLength: 64
  debitBalance:
    type: number
    description: The debit balance of the entry
    minimum: 0
    maximum: 999999999999999
  creditBalance:
    type: number
    description: The credit balance of the entry
    minimum: 0
    maximum: 999999999999999
  totalBalance:
    type: number
    description: The total balance of the entry
  state:
    type: string
    description: The state of the entry
    minLength: 1
    maxLength: 64
  stateReason:
    type: string
    description: The state reason of the entry
    nullable: true
    minLength: 1
    maxLength: 256
  creationDate:
    type: string
    format: date-time
    description: The creation date of the entry
  lastUpdate:
    type: string
    format: date-time
    description: The last update of the entry
    