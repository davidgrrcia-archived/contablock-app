type: object
title: Entry
description: Entry details
required:
  - accountId
  - multipleEntryId
  - currency
  - date
properties:
  id:
    type: string
    description: The id of the entry
    minLength: 1
    maxLength: 64
  accountId:
    type: string
    description: The id of the account
    minLength: 1
    maxLength: 64
  multipleEntryId:
    type: string
    description: The id of the multiple entry
    minLength: 1
    maxLength: 64
  currency:
    type: string
    description: The currency of the entry
    minLength: 3
    maxLength: 3
  concept:
    type: string
    description: The concept of the entry
    minLength: 1
    maxLength: 256
  date:
    type: string
    description: The date of the entry
    minLength: 1
    maxLength: 64
  debitBalance:
    type: number
    description: The debit balance of the entry
    minimum: 0
    maximum: 999999999999999
  creditBalance:
    type: number
    description: The credit balance of the entry
    minimum: 0
    maximum: 999999999999999