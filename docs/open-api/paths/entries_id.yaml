get:
  summary: Describe Entry
  operationId: describeEntry
  description: Info for a specific entry
  tags:
    - entries
  parameters:
    - name: id
      in: path
      required: true
      description: The id of the entry to retrieve
      schema:
        type: string
  responses:
    '200':
      description: An entry
      content:
        application/json:
          schema:
            $ref: "../schemas/Entries_DescribeResponse.yaml"
    '403':
        $ref: "../responses/common/Unauthorized.yaml"
    '404':
        $ref: "../responses/common/NotFound.yaml"
    default:
      $ref: "../responses/common/UnexpectedError.yaml"