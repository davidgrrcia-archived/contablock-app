get:
  summary: Describe Business
  operationId: describeBusiness
  description: Info for a specific business
  tags:
    - business
  parameters:
    - name: id
      in: path
      required: true
      description: The id of the business to retrieve
      schema:
        type: string
  responses:
    '200':
      description: A business
      content:
        application/json:
          schema:
            $ref: "../schemas/Business_DescribeResponse.yaml"
    '403':
        $ref: "../responses/common/Unauthorized.yaml"
    '404':
        $ref: "../responses/common/NotFound.yaml"
    default:
      $ref: "../responses/common/UnexpectedError.yaml"