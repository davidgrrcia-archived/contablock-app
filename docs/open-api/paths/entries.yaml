get:
  summary: List Entries
  operationId: listEntries
  description: List all entries
  tags:
  - entries
  responses:
    '200':
      description: An array of entries
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../schemas/Entries_ListResponse.yaml"
    '403':
        $ref: "../responses/common/Unauthorized.yaml"
    '404':
        $ref: "../responses/common/NotFound.yaml"
    default:
        $ref: "../responses/common/UnexpectedError.yaml"

post:
  summary: Create Entry
  operationId: createEntry
  description: Create an entry
  tags:
  - entries

  requestBody:
    description: "Create an entry. \n >DebitBalance o CreditBalance es requerido pero no los dos al mismo tiempo."
    required: true
    content:
      application/json:
        schema:
          $ref: "../schemas/Entries_Create.yaml"

  responses:
    '201':
      description: An entry
      content:
        application/json:
          schema:
            $ref: "../schemas/Entries_DescribeResponse.yaml"
    '403':
        $ref: "../responses/common/Unauthorized.yaml"
    '404':
        $ref: "../responses/common/NotFound.yaml"
    default:
        $ref : "../responses/common/UnexpectedError.yaml"
