get:
  summary: List General Ledger
  operationId: listGeneralLedger
  description: List all entries grouped by account id
  tags:
  - general-ledger
  responses:
    '200':
      description: An array of entries grouped by account id
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../schemas/GeneralLedger_ListResponse.yaml"
    '403':
        $ref: "../responses/common/Unauthorized.yaml"
    '404':
        $ref: "../responses/common/NotFound.yaml"
    default:
        $ref: "../responses/common/UnexpectedError.yaml"
