get:
  summary: List Daily Ledger
  operationId: listDailyLedger
  description: List all entries grouped by multiple entry id
  tags:
  - daily-ledger
  responses:
    '200':
      description: An array of entries grouped by multiple entry id
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../schemas/DailyLedger_ListResponse.yaml"
    '403':
        $ref: "../responses/common/Unauthorized.yaml"
    '404':
        $ref: "../responses/common/NotFound.yaml"
    default:
        $ref: "../responses/common/UnexpectedError.yaml"
