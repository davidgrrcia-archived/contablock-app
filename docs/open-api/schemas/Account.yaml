type: object
title: Account
description: Account Database Schema
required:
  - id
  - name
  - level
properties:
  id:
    type: string
    description: The id of the account
    minLength: 1
    maxLength: 64
  name:
    type: string
    description: The name of the account
    minLength: 1
    maxLength: 256
  level:
    type: string
    description: The level of the account
    minLength: 1
    maxLength: 64
  type:
    type: string
    description: The type of the account
    nullable: true
    minLength: 1
    maxLength: 64