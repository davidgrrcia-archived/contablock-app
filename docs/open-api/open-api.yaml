  title: Contablock
  description: |
    This API allows you to interact with the Contablock backend.
    It is a REST API that uses JSON for serialization.
    It is designed to be used by the Contablock frontend.
  license:
    name: MIT
  contact:
    name: API Support
    url: http://www.example.com/support
    email: support@example.com
