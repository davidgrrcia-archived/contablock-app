    $ref: "./paths/accounts.yaml"
  /accounts/{id}:
    $ref: "./paths/accounts_id.yaml"
components:
  schemas:
    $ref: "./schemas/_index.yaml"
  responses:
    $ref: "./responses/_index.yaml"
