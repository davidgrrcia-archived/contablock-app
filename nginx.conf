worker_processes 1;

events { worker_connections 1024; }

http {
    sendfile on;
    large_client_header_buffers 4 32k;

    server {
        listen 80;
        server_name site;

        # location / {
        #     return 301 https://$host$request_uri;
        # }

         location / { # La ruta raíz 
          proxy_pass http://frontend:5173; # Redirigir al servicio frontend 
          proxy_redirect     off;
          proxy_http_version 1.1;
          proxy_cache_bypass $http_upgrade;
          proxy_set_header   Upgrade $http_upgrade;
          proxy_set_header   Connection keep-alive;
          proxy_set_header   Host $host;
          proxy_set_header   X-Real-IP $remote_addr;
          proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $scheme;
          proxy_set_header   X-Forwarded-Host $server_name;
          proxy_buffer_size           128k;
          proxy_buffers               4 256k;
          proxy_busy_buffers_size     256k;
        }

        location /blockchain { # La ruta para los contratos 
          proxy_pass http://blockchain:8545; # Redirigir al servicio contracts 
        }

         location /api { # La ruta para la API 
          proxy_pass http://backend:4000; # Redirigir al servicio backend 
        }
    }

    server {
        listen 443 ssl;
        server_name site;

        ssl_certificate /etc/nginx/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/nginx-selfsigned.key;

        # location / { # La ruta raíz 
        #   proxy_pass http://frontend:5173; # Redirigir al servicio frontend 
        #   proxy_redirect     off;
        #   proxy_http_version 1.1;
        #   proxy_cache_bypass $http_upgrade;
        #   proxy_set_header   Upgrade $http_upgrade;
        #   proxy_set_header   Connection keep-alive;
        #   proxy_set_header   Host $host;
        #   proxy_set_header   X-Real-IP $remote_addr;
        #   proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        #   proxy_set_header   X-Forwarded-Proto $scheme;
        #   proxy_set_header   X-Forwarded-Host $server_name;
        #   proxy_buffer_size           128k;
        #   proxy_buffers               4 256k;
        #   proxy_busy_buffers_size     256k;
        # }
       
    }
}